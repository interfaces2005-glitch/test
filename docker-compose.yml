services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: lumi_local
      POSTGRES_DB: lumi
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi"]
      interval: 5s
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
